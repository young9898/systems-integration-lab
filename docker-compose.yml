services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - middleware

  middleware:
    build: ./middleware
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: inventory
      DB_USER: app
      # Supplied by .env (see .env.example). The ":?" makes Compose refuse to
      # start with a clear error rather than silently booting a default password.
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env — copy .env.example to .env}
      OLLAMA_MODEL: llama3.2:3b
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: app
      # Must match DB_PASSWORD above — both read the same .env variable, so they
      # cannot drift apart and leave the middleware unable to authenticate.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env — copy .env.example to .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  ollama_data:
