services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - middleware

  middleware:
    build: ./middleware
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: inventory
      DB_USER: app
      DB_PASSWORD: app_dev_password
      OLLAMA_MODEL: llama3.2:3b
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  ollama_data:
